<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css ">
</head>

<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>

            <!-- TUGAS MANDIRI NO 3: Penghitung Jumlah Buku -->
            <p id="counter-buku" style="font-weight: bold; margin-bottom: 10px;">
                Menampilkan 0 dari 0 buku
            </p>

            <!-- PRAKTIKUM HARI INI: Indikator Loading saat Fetch API -->
            <div id="loading-indicator" style="display: none; font-style: italic; color: #666; margin-bottom: 10px;">
                Memuat data buku...
            </div>

            <div class="table-responsive">
                <!-- Kait ID 'tabel-buku' ditambahkan agar mudah diakses JavaScript -->
                <table id="tabel-buku">
                    <thead>
                        <tr>
                            <!-- TUGAS MANDIRI NO 1: Ditambahkan kolom ISBN -->
                            <th>ISBN</th>
                            <th>Judul</th>
                            <th>Pengarang</th>
                            <th>Tahun</th>
                            <th>Stok</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Biarkan KOSONG! JavaScript yang akan mengisi baris ini via fetch() -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5</p>
    </footer>
    <script src="../assets/js/app.js"></script>
